name: link-check
on: push
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium webkit
      - run: node check.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check
          path: out
