# Compiles the iOS app for the simulator with no Apple account and no signing. It proves the project
# builds; the result cannot be installed on a real iPhone. Capacitor 8 needs Xcode 26 or newer, so the
# first step prints the runner's Xcode version: if it is older, switch to a newer macOS image.
name: iOS simulator build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run sync:ios
      - run: npm run check
      - name: Compile for the simulator, unsigned
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO build
      # The Preferences plugin uses UserDefaults, which Apple wants declared in a privacy manifest inside the app.
      - name: Check the privacy manifest and the web game are inside the built app
        run: |
          app=ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          test -f "$app/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy is not in the built app"; exit 1; }
          grep -q NSPrivacyAccessedAPICategoryUserDefaults "$app/PrivacyInfo.xcprivacy"
          test -f "$app/public/native.js" || { echo "::error::native.js is not in the built app"; exit 1; }
