name: Web tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bloomshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run every suite
        run: |
          for t in test-engine test-rush test-pwa test-sound test-garden test-save-integration test-moon-engine test-moon-levels test-precache-streams test-store test-native check-moon-pointer test-koi-levels test-keepsakes test-goals test-depths test-powers; do
            echo "== $t"
            node qa/$t.cjs > /dev/null || { echo "FAILED: $t"; node qa/$t.cjs | tail -40; exit 1; }
          done

  # Keeps the native packaging honest: if a game change breaks the Android/iOS copy step
  # (a new file missing from sw.js ASSETS, a changed index.html), this fails before anyone ships.
  native-packaging:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - run: npm run sync
      - run: npm run check
