name: Web tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bloomshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run every suite
        run: |
          # Every suite in qa/ runs, so a new test-*.cjs is picked up without editing this list.
          for f in qa/test-*.cjs qa/check-moon-pointer.cjs; do
            echo "== $f"
            node "$f" > /dev/null || { echo "FAILED: $f"; node "$f" | tail -40; exit 1; }
          done

  # Keeps the native packaging honest: if a game change breaks the Android/iOS copy step
  # (a new file missing from sw.js ASSETS, a changed index.html), this fails before anyone ships.
  native-packaging:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - run: npm run sync
      - run: npm run check
